[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinews"
dynamic = ["version"]
description = "Leitor de RSS para o terminal"
requires-python = ">=3.10"

[project.scripts]
clinews = "clinews.app:main"

[tool.setuptools]
packages = ["clinews"]

[tool.setuptools.dynamic]
version = {attr = "clinews.__version__"}
