name: Publicar na Snap Store

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Dois envios ao mesmo tempo viram duas revisões na loja em ordem incerta.
concurrency:
  group: snap-store
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Rodar os testes
        run: PYTHONPATH=. python3 -m unittest tests.test_app

      # A versão mora no snapcraft.yaml, e é ela que a loja recebe. Numa tag as
      # duas têm que dizer o mesmo número, senão o repositório fica marcando uma
      # versão que não existe na Snap Store.
      - name: Conferir se a tag bate com a versão
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          yaml=$(sed -n "s/^version: *'\(.*\)'/\1/p" snap/snapcraft.yaml)
          tag=${GITHUB_REF_NAME#v}
          if [ "$yaml" != "$tag" ]; then
            echo "snapcraft.yaml diz '$yaml' e a tag diz '$tag'" >&2
            exit 1
          fi

      - name: Compilar o snap
        id: build
        uses: snapcore/action-build@v1

      # Tag vai para stable, que é o canal que o público instala. Qualquer outro
      # push para na edge: a loja acompanha a main sem levar junto cada commit.
      - name: Enviar para a Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'edge' }}
