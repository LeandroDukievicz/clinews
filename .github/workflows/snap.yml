name: Publicar na Snap Store

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Dois envios ao mesmo tempo viram duas revisões na loja em ordem incerta.
concurrency:
  group: snap-store
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Rodar os testes
        run: PYTHONPATH=. python3 -m unittest tests.test_app

      # A versão mora em dois arquivos e a loja recebe a do snapcraft.yaml.
      # Numa tag os três têm que dizer o mesmo número, senão o repositório fica
      # marcando uma versão que não existe na Snap Store.
      - name: Conferir se a tag bate com a versão
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          yaml=$(sed -n "s/^version:[[:space:]]*['\"]\{0,1\}\([^'\"]*\)['\"]\{0,1\}[[:space:]]*$/\1/p" snap/snapcraft.yaml)
          toml=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' pyproject.toml)
          tag=${GITHUB_REF_NAME#v}
          echo "snapcraft.yaml=$yaml  pyproject.toml=$toml  tag=$tag"
          if [ -z "$yaml" ] || [ "$yaml" != "$tag" ] || [ "$toml" != "$tag" ]; then
            echo "::error::versão divergente entre snapcraft.yaml, pyproject.toml e a tag"
            exit 1
          fi

      - name: Compilar o snap
        id: build
        uses: snapcore/action-build@v1

      # Tag vai para stable, que é o canal que o público instala. Qualquer outro
      # push para na edge: a loja acompanha a main sem levar junto cada commit.
      - name: Enviar para a Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'edge' }}

      # `snapcraft upload` envia só o pacote: resumo, descrição e ícone ficam
      # para trás. Sem este passo, mudar a descrição no snapcraft.yaml nunca
      # chega na página da loja. Só numa tag, que é quando o texto publicado
      # muda de verdade, e com --force porque o painel da loja ganha do
      # manifesto quando alguém edita por lá.
      - name: Atualizar a descrição na loja
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          sudo snap install snapcraft --classic
          snapcraft upload-metadata "${{ steps.build.outputs.snap }}" --force
